{% extends "base.html" %}
{% block content %}

<div class="container py-4">

  <h3 class="fw-bold mb-3">
    <i class="fas fa-file-alt"></i> {{ document.name }}
  </h3>

  {% if document.doc_type == "internal" %}
    <pre class="p-3 bg-light rounded">{{ document.content }}</pre>
    <a href="{% url 'teams:team_edit_internal_document' team.pk document.pk %}" class="btn btn-primary">Edit</a>
  {% elif document.doc_type == "file" %}
    <a href="{{ document.file.url }}" class="btn btn-primary" download>Download File</a>
  {% elif document.doc_type == "link" %}
    <a href="{{ document.external_url }}" class="btn btn-primary" target="_blank">Open Link</a>
  {% endif %}

</div>

{% endblock %}
