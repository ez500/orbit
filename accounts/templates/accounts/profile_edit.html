{% extends "base.html" %}
{% block content %}
    <h1>Edit Profile</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ user_form.as_p }}
        {{ profile_form.as_p }}
        <button type="submit">Save Changes</button>
        <a href="{% url 'accounts:profile_view' username=user.username %}">Cancel</a>
    </form>
{% endblock %}
