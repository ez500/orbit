{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link href="{% static 'css/form.css' %}" rel="stylesheet">
{% endblock extra_css %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card-group">
            <div class="card p-4">
                <div class="card-body">
                    <h1>Login</h1>

                    {% if form.errors %}
                        {% for error in form.non_field_errors %}
                            <p class="alert alert-danger" role="alert"><span style="font-weight:bold">{{ error }}</span>
                            </p>
                        {% endfor %}
                    {% endif %}

                    <form action="." method="POST">
                        {% csrf_token %}
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="fas fa-at"></i>
                            </span>
                            <input class="form-control" name="email" type="email" placeholder="Email" autofocus>
                        </div>
                        <div class="row">
                            <div class="col-4">
                                <button class="btn btn-primary px-4" type="submit">Reset Password</button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-1 text-right">
                                <a class="btn btn-link px-0" href="{% url 'accounts:login' %}">Login</a>
                            </div>
                            <div class="col-2 text-right">
                                <a class="btn btn-link px-0" href="{% url 'accounts:register' %}">Register</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
