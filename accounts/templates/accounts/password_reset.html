{% extends 'base.html' %}
{% block content %}
    {% if form.errors %}
        {% for key, value in form.errors.items %}
            <strong>{{ value }}</strong>
        {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset Password</button>
    </form>
    <a href="{% url 'accounts:register' %}">Create a New Account</a>
    <a href="{% url 'accounts:login' %}">Back to Login</a>
{% endblock content %}
