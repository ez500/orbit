{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h3 class="fw-bold text-primary mb-3">
        <i class="fas fa-user-plus me-2"></i>Add Collaborator
      </h3>

      <p class="text-muted">
        Add a collaborator to <strong>{{ project.name }}</strong>.  
        Only registered users can be added.
      </p>

      <form method="POST" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" name="username" id="username" class="form-control"
                 placeholder="Enter username (e.g., johndoe)" required>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{% url 'projects:project_detail' project.pk %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-user-plus me-1"></i> Add Collaborator
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
