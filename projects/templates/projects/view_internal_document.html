{% extends "base.html" %}
{% block content %}

<div class="container py-4">
  <h3 class="fw-bold text-primary">{{ doc.name }}</h3>
  <p class="text-muted mb-3">Written by {{ doc.uploaded_by.username }} • {{ doc.uploaded_at }}</p>
  <hr>

  <div class="border rounded p-3 bg-white" style="min-height: 400px;">
    {{ doc.content|safe }}
  </div>

  <a href="{% url 'projects:edit_internal_document' doc.pk %}" 
     class="btn btn-primary mt-4">
     <i class="fas fa-edit me-2"></i>Edit Document
  </a>
</div>

{% endblock %}
