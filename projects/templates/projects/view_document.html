{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="fas fa-file-alt me-2"></i>{{ document.name }}</h5>
      <a href="{% url 'projects:project_dashboard' project.pk %}" class="btn btn-light btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Back
      </a>
    </div>
    <div class="card-body">
      <p><strong>Uploaded by:</strong> {{ document.uploaded_by.username }}</p>
      <p><strong>Uploaded on:</strong> {{ document.uploaded_at|date:"F j, Y, g:i a" }}</p>
      <a href="{{ document.file.url }}" class="btn btn-success" download>
        <i class="fas fa-download me-1"></i> Download File
      </a>
    </div>
  </div>
</div>
{% endblock %}
