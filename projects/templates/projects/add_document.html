{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="fas fa-upload me-2"></i>Upload Document to {{ project.name }}</h5>
      <a href="{% url 'projects:project_dashboard' project.pk %}" class="btn btn-light btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Back
      </a>
    </div>
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          {{ form.name.label_tag }}
          {{ form.name }}
        </div>
        <div class="mb-3">
          {{ form.file.label_tag }}
          {{ form.file }}
        </div>
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary me-2"><i class="fas fa-check"></i> Upload</button>
          <a href="{% url 'projects:project_dashboard' project.pk %}" class="btn btn-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
