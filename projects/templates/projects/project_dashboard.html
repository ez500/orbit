{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-primary">
      <i class="fas fa-tachometer-alt me-2"></i>{{ project.name }} Dashboard
    </h3>
    <a href="{% url 'projects:project_detail' project.pk %}" class="btn btn-outline-secondary btn-sm">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h5 class="card-title text-primary fw-semibold mb-3"><i class="fas fa-tasks me-2"></i>Tasks</h5>
          <p class="text-muted">No tasks implemented yet — coming soon!</p>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h5 class="card-title text-primary fw-semibold mb-3"><i class="fas fa-comments me-2"></i>Messages</h5>
          <p class="text-muted">Company and AI-agent messages will appear here.</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
