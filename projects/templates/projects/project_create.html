{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-body">
      <h4 class="mb-4 text-center text-primary"><i class="fas fa-plus-circle me-2"></i>Create New Project</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Project Name</label>
          <input type="text" name="name" class="form-control" placeholder="Enter project name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="4" placeholder="Project details (optional)"></textarea>
        </div>

	<div class="mb-3">
  	<label class="form-label">Team (optional)</label>
  	{{ form.team }}
	<div class="mb-3">
        <label class="form-label">Associated Companies</label>
        {{ form.companies }}
        <div class="form-text">Select one or more companies this project belongs to (optional).</div>
        </div>
	</div>
        <div class="d-flex justify-content-end">
          <a href="{% url 'projects:project_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
