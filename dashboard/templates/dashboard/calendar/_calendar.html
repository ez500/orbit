{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/listCalendar.css' %}">
{% endblock %}

<div id="calendarView" class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0" id="currentMonth">October 2025</h5>
            <div class="btn-group">
                <button class="btn btn-outline-secondary" id="prevMonth">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="btn btn-outline-secondary" id="nextMonth">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="calendar">
            <div class="row g-0 calendar-header mb-2">
                <div class="col text-center py-2">Sun</div>
                <div class="col text-center py-2">Mon</div>
                <div class="col text-center py-2">Tue</div>
                <div class="col text-center py-2">Wed</div>
                <div class="col text-center py-2">Thu</div>
                <div class="col text-center py-2">Fri</div>
                <div class="col text-center py-2">Sat</div>
            </div>
            <div id="calendarGrid">
                <!-- Calendar days will be inserted here by JavaScript -->
            </div>
        </div>
         <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0"></h5>
            <input type="url" id="calUrl" name="{% static 'basic.ics' %}" placeholder="https://calendar.com" />
            <div class="btn-group">
                <button class="btn btn-light" id="urlImport">
                    URL Import
                </button>
                <input type="file" id="fileInput" accept=".ics" style="display: none;" />
                <button class="btn btn-light" id="calImport">
                    Import
                </button>
                <button class="btn btn-light" id="calExport">
                    Export
                </button>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
    {{ tasks|json_script:"tasks-data" }}
    <script src="{% static 'js/calendar.js' %}"></script>
{% endblock %}
