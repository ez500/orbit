<div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title">Add New Task</h5>
                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                ></button>
            </div>
            <div class="modal-body">
                <form id="addTaskForm">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="taskTitle" required/>
                    </div>
                    <div class="mb-3">
                        <label for="taskContent" class="form-label">Description</label>
                        <textarea
                                class="form-control"
                                id="taskContent"
                                rows="3"
                        ></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="taskDeadline" class="form-label">Due Date</label>
                            <input
                                    type="date"
                                    class="form-control"
                                    id="taskDeadline"
                            />
                        </div>
                        <div class="col-md-6">
                            <label for="taskStatus" class="form-label">Status</label>
                            <select class="form-select" id="taskStatus" required>
                                <option value="todo">To Do</option>
                                <option value="in_progress">In Progress</option>
                                <option value="review">Pending Review</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="id_team" class="form-label">Team</label>
                            <select class="form-select" id="id_team">
                                <option value="">No Team</option>
                                {% for team in teams %}
                                    <option value="{{ team.id }}">{{ team.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="id_project" class="form-label">Project</label>
                            <select class="form-select" id="id_project">
                                <option value="">No Project</option>
                                {% for project in projects %}
                                    <option value="{{ project.id }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="id_users" class="form-label">Assignees</label>
                        <select class="form-select" id="id_users" multiple>
                            <option value="{{ user.id }}">{{ user.username }}</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button" class="btn btn-primary" id="addTaskBtn">
                    Add Task
                </button>
            </div>
        </div>
    </div>
</div>
