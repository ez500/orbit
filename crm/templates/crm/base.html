<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/template.css' %}" />
    <!-- Adding Inter font using fonts.google.com for a more modern look on website-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ title }} {% endblock %}</title>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <div class="logo">Orbit</div>
          <ul class="nav-links">
            <li><a href="{% url 'crm:home' %}">Home</a></li>
            <li><a href="{% url 'crm:dashboard' %}">Dashboard</a></li>
            <li><a href="/admin/">Admin</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">{% block content %}{% endblock %}</div>
    </main>

    <footer>
      <div class="container">
        <p>
          &copy; 2025 VerAlign. AI-based Customer Relationship Management. All
          Rights Reserved.
        </p>
      </div>
    </footer>

    {% block extra_js %}{% endblock %}
  </body>
</html>
