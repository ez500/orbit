{% extends 'base.html' %} {% block content %}
<div class="container-fluid p-0">
  <!-- Stats Grid -->
  <div class="row g-4 mb-4">
    <div class="col-md-3">
      <div class="stat-card">
        <h6 class="text-muted mb-2">Active Tasks</h6>
        <h2 class="mb-0">20</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <h6 class="text-muted mb-2">Team Members</h6>
        <h2 class="mb-0">8</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <h6 class="text-muted mb-2">Projects</h6>
        <h2 class="mb-0">4</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <h6 class="text-muted mb-2">Task Completion</h6>
        <h2 class="mb-0">89%</h2>
      </div>
    </div>
  </div>

  <!-- Tasks and Insights -->
  <div class="row g-4">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-4">Today's Tasks</h5>
          <div class="task-list">
            <p class="text-muted">No tasks scheduled for today</p>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-4">Orbit Insights</h5>
          <div class="insights-list">
            <p class="text-muted">No new insights available</p>
          </div>
          <button class="btn btn-light mt-3 w-100">Explore</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
